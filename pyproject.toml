[project]
name = "physics-auditor"
version = "0.1.0"
description = "A controllable-generative causal test-bench for video world models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pymunk>=6.6",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physics_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
