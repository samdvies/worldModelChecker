[project]
name = "physics-auditor"
version = "0.1.0"
description = "A controllable-generative causal test-bench for video world models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pymunk>=6.6",
    "pillow>=10.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]
gpu = ["transformers>=4.45", "accelerate>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physics_auditor"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast (<=10s total) TORCH-FREE pre-flight tier -- import + wiring checks, run before every remote GPU-box dispatch (see scripts/aws/runbook.md)",
    "smoke_torch: torch-backed pre-flight tier (mock-injected models only) -- run right after `smoke`, not held to the <=10s bar (torch import alone costs ~15s cold in this environment; see docs/failure-sweeps.md)",
]
